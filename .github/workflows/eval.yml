name: MRDS Eval

"on":
  pull_request:
    paths:
      - "prompts/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python test_mrds.py

      - name: Run evaluation (mock, fast)
        run: python runner.py --provider mock --no-judge --concurrency 8

      - name: Generate report and CI summary
        id: summary
        run: python scripts/ci_summary.py --report-path data/ci_report.html --summary-file /tmp/mrds_summary.md

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrds-report
          path: data/ci_report.html

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            let body = "MRDS summary unavailable.";
            try { body = fs.readFileSync("/tmp/mrds_summary.md", "utf8"); } catch (e) {}
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });