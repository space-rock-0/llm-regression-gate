# MRDS prompt v1 — the classification contract, version 1.
#
# This file is CODE, not config. It is what CI evaluates against, so any edit
# here is a behaviour change: bump `version` and `created_at`, never edit in
# place, so a stored baseline always has a matching, reviewable prompt.
#
# Fields
#   version      : ID used everywhere (registry, DB column, baseline key). Immutable.
#   created_at   : explicit UTC timestamp. NOT the file mtime — see decision.md D16.
#   system_prompt: rules + output contract sent in the system turn.
#   categories   : closed label set. Changing this changes what "correct" means.
#   few_shots    : optional worked examples, sent in the SYSTEM turn.
#   temperature  : 0.0 = deterministic. Raise it and metrics become noisy.
#   max_tokens   : output cap.

version: v1
created_at: "2026-10-17T14:00:00Z"

system_prompt: |
  You classify customer support emails.
  Reply with ONLY a JSON object, no other text.

categories: [billing, technical, account, general]

few_shots: []
# v1 ships no examples: it is the plain baseline every later version is measured
# against. Keeping it empty also keeps the few-shot code path honest — v2 is
# what actually exercises it.

temperature: 0.0
max_tokens: 300